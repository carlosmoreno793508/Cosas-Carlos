<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TID-MAX">
<link rel="manifest" href="./manifest.webmanifest">
<title>TID-MAX</title>
<style>
  :root{
    --ground:#0d1420; --panel:#131d2c; --panel2:#182536; --raise:#1e2d42;
    --ink:#eaf1f8; --dim:#93a6bd; --faint:#63768f; --line:#26364f;
    --aqua:#22ccc0; --aqua-deep:#0f9c94; --good:#37d29a; --warn:#f6b543; --crit:#ff5a60;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  .app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
  .view{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 92px;-webkit-overflow-scrolling:touch}
  .num{font-variant-numeric:tabular-nums}
  /* header */
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .top .h{font-size:21px;font-weight:800}
  .top .s{font-size:12px;color:var(--dim);margin-top:1px}
  .tid{width:40px;height:40px;border-radius:11px;flex:none;background:linear-gradient(135deg,var(--aqua),var(--aqua-deep));
    display:grid;place-items:center;color:#04211f;font-weight:800;font-size:13px}
  /* cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 16px;margin-bottom:12px}
  .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
  .dot{width:48px;height:48px;border-radius:50%;flex:none}
  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
  .m{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 10px;text-align:center}
  .mv{font-size:23px;font-weight:800}
  .mv .u{font-size:12px;color:var(--dim);font-weight:600}
  .ml{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;font-weight:700;font-size:15px;border:none;cursor:pointer;font-family:inherit}
  .btn.pri{background:linear-gradient(135deg,var(--aqua),var(--aqua-deep));color:#04211f}
  .btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line);margin-top:10px}
  .pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
  .pill.ok{color:#04211f;background:var(--good)}
  .pill.go{color:var(--aqua);background:rgba(34,204,192,.14);border:1px solid rgba(34,204,192,.34)}
  .src{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .src .ic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px}
  .src .nm{font-weight:700;font-size:14.5px}
  .src .sub{font-size:11.5px;color:var(--dim);margin-top:1px}
  .plan{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .plan .e{font-size:20px}
  .plan .t{font-size:13.5px;font-weight:700}
  .plan .d{font-size:12px;color:var(--dim);margin-top:1px}
  .hint{font-size:12px;color:var(--dim);line-height:1.5}
  .sub-note{text-align:center;font-size:10.5px;color:var(--faint);margin-top:9px}
  /* tab bar */
  .tabs{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;
    padding:9px 6px calc(env(safe-area-inset-bottom) + 10px);background:rgba(19,29,44,.94);
    backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .tabs button{background:none;border:none;color:var(--faint);font-family:inherit;font-size:10px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:2px 12px}
  .tabs button .g{width:21px;height:21px;border-radius:7px;background:currentColor;opacity:.85}
  .tabs button.on{color:var(--aqua)}
  .loading{padding:70px 20px;text-align:center;color:var(--dim)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="view" id="view"><div class="loading">Cargando…</div></div>
  <nav class="tabs">
    <button data-tab="hoy" class="on"><span class="g"></span>Hoy</button>
    <button data-tab="entrenar"><span class="g"></span>Entrenar</button>
    <button data-tab="datos"><span class="g"></span>Datos</button>
    <button data-tab="perfil"><span class="g"></span>Perfil</button>
  </nav>
</div>

<script>
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SEMC = {verde:"--good", amarillo:"--warn", rojo:"--crit"};
let DATA = null;

const SOURCES = [
  {nm:"WHOOP", sub:"Recovery, HRV, sueño", bg:"#00b0b9", ic:"◉", on:true},
  {nm:"Strava", sub:"Carreras, ritmo, zonas", bg:"#fc4c02", ic:"▲"},
  {nm:"Polar", sub:"FC continua · R-R (H10)", bg:"#d51e2a", ic:"●"},
  {nm:"Garmin", sub:"Multideporte + natación", bg:"#007cc3", ic:"◆"},
  {nm:"Apple Salud", sub:"Todo lo del iPhone", bg:"#f2f4f7", fg:"#111", ic:"♥"},
];

function vHoy(d){
  const semc = SEMC[d.semaforo]||"--warn";
  const s=d.sueno||{}, h=d.hrv||{}, fo=d.forma||{};
  return `
  <div class="top">
    <div><div class="h">Hola, Carlos</div><div class="s">${esc(d.fecha_texto||"")}</div></div>
    <div class="tid">TID</div>
  </div>
  <div class="card" style="display:flex;align-items:center;gap:13px">
    <div class="dot" style="background:radial-gradient(circle at 35% 30%, #ffffff55, var(${semc}));box-shadow:0 0 0 6px color-mix(in srgb, var(${semc}) 16%, transparent)"></div>
    <div><div class="k">Semáforo de hoy</div>
      <div style="font-size:19px;font-weight:800;margin-top:2px"><span style="color:var(${semc})">${(d.semaforo||"").toUpperCase()}</span> · ${d.recovery}%</div>
      <div class="hint" style="margin-top:2px">${esc(d.semaforo_desc||"")}</div></div>
  </div>
  <div class="mini">
    <div class="m"><div class="mv num">${d.recovery}<span class="u">%</span></div><div class="ml">Recovery</div></div>
    <div class="m"><div class="mv num">${h.ms??"—"}<span class="u">ms</span></div><div class="ml">HRV</div></div>
    <div class="m"><div class="mv num">${s.total_h??"—"}<span class="u">h</span></div><div class="ml">Sueño</div></div>
  </div>
  <div class="card">
    <div class="k" style="color:var(--aqua)">Coach de hoy</div>
    <div class="hint" style="color:var(--ink);margin-top:6px">${esc(fo.lectura||"—")}</div>
  </div>
  <div class="card" style="display:flex;justify-content:space-between;align-items:center">
    <div><div class="k">Evento</div><div style="font-size:14px;font-weight:700;margin-top:2px">${esc(d.evento||"—")}</div></div>
    <div style="text-align:right"><div style="font-size:24px;font-weight:800;line-height:1" class="num">${d.dias_al_evento??"—"}</div><div style="font-size:10px;color:var(--dim)">días</div></div>
  </div>`;
}

function vEntrenar(d){
  const fo=d.forma||{};
  return `
  <div class="top"><div><div class="h">Tu plan de hoy</div><div class="s">Calibrado a tu readiness y al taper</div></div></div>
  <div class="card" style="border-color:rgba(55,210,154,.3);background:rgba(55,210,154,.07)">
    <div class="k" style="color:var(--good)">Pico: ${esc((fo.estado_pico||"—").replace("_"," "))}</div>
    <div class="hint" style="color:var(--ink);margin-top:6px">${esc(fo.lectura||"—")}</div>
  </div>
  <div class="plan"><span class="e">🏊</span><div><div class="t">Entreno</div><div class="d">Sesión del día según tu plan</div></div></div>
  <div class="plan"><span class="e">😴</span><div><div class="t">Sueño</div><div class="d">Meta calibrada a tu recuperación</div></div></div>
  <div class="plan"><span class="e">🥗</span><div><div class="t">Nutrición</div><div class="d">Consumido vs meta del día</div></div></div>
  <button class="btn pri" style="margin-top:14px" onclick="alert('GPS + FC en vivo (BLE al H10) — llega en la v1 🏃')">▶  Iniciar entrenamiento</button>
  <div class="sub-note">GPS + FC en vivo · llega en la v1</div>`;
}

function vDatos(){
  return `
  <div class="top"><div><div class="h">Conecta tus datos</div><div class="s">Te llevamos al sitio de cada uno para entrar seguro</div></div></div>
  ${SOURCES.map(s=>`
    <div class="src">
      <div class="ic" style="background:${s.bg};color:${s.fg||"#04121a"}">${s.ic}</div>
      <div style="flex:1"><div class="nm">${esc(s.nm)}</div><div class="sub">${esc(s.sub)}</div></div>
      ${s.on?`<span class="pill ok">Conectado</span>`:`<button class="pill go" style="border:none;cursor:pointer;font-family:inherit" onclick="alert('Aquí abre el login de ${esc(s.nm)} (OAuth). Se conecta en la v0.')">Conectar</button>`}
    </div>`).join("")}
  <div class="sub-note">Nunca guardamos tu contraseña — la tecleas en el sitio de cada plataforma.</div>`;
}

function vPerfil(d){
  return `
  <div class="top"><div><div class="h">Perfil</div><div class="s">${esc(d.atleta||"")}</div></div><div class="tid">TID</div></div>
  <div class="card"><div class="k">Deporte</div><div style="font-size:15px;font-weight:700;margin-top:3px">${esc(d.deporte||"—")} · ${esc(d.fase||"")}</div></div>
  <div class="card"><div class="k">Datos</div><div class="hint" style="margin-top:4px">${d.dias_datos||0} días · fuente: WHOOP + motor TID-MAX</div></div>
  <button class="btn sec" onclick="switchTab('datos')">Conectar más fuentes</button>
  <div class="sub-note">TID-MAX · orientación de rendimiento y bienestar, no diagnóstico médico.</div>`;
}

const VIEWS = {hoy:vHoy, entrenar:vEntrenar, datos:()=>vDatos(), perfil:vPerfil};

function switchTab(tab){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  const el=document.getElementById("view");
  el.scrollTop=0;
  el.innerHTML = DATA ? VIEWS[tab](DATA) : '<div class="loading">Cargando…</div>';
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>switchTab(b.dataset.tab)));

fetch("./data.json?v="+Date.now()).then(r=>r.json()).then(d=>{DATA=d;switchTab("hoy");})
  .catch(e=>{document.getElementById("view").innerHTML='<div class="loading">No pude cargar los datos.<br>'+esc(e.message)+'</div>';});

if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}
</script>
</body>
</html>

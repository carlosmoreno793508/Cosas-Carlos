name: TID-MAX · reporte diario

# Corre el pipeline en la NUBE (sin la Mac de Carlos): baja WHOOP, procesa, genera el reporte
# y actualiza tid-max/web/data.json. Vercel redepliega solo la web al hacer push.
#
# Requiere estos SECRETS del repo (Settings → Secrets and variables → Actions):
#   WHOOP_CLIENT_ID, WHOOP_CLIENT_SECRET, WHOOP_REFRESH_TOKEN, ANTHROPIC_API_KEY
#   GH_PAT  (token fino con permiso 'Secrets: write' — para reguardar el token WHOOP rotado)
#
# Prueba manual: pestaña Actions → este workflow → "Run workflow".

on:
  schedule:
    - cron: "30 14 * * *"   # 8:30 am CDMX (UTC-6)  ·  14:30 UTC  — reporte de la mañana
    - cron: "0 21 * * *"    # 3:00 pm CDMX (UTC-6)  ·  21:00 UTC  — re-sync de la tarde (atrapa la siesta)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tid-max-daily
  cancel-in-progress: false

jobs:
  reporte:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencias
        run: pip install anthropic requests python-dotenv

      - name: Sembrar token WHOOP actual
        working-directory: tid-max/software
        env:
          WHOOP_REFRESH_TOKEN: ${{ secrets.WHOOP_REFRESH_TOKEN }}
        run: printf 'WHOOP_REFRESH_TOKEN=%s\n' "$WHOOP_REFRESH_TOKEN" > .env

      - name: Correr pipeline MULTIUSUARIO (por atleta → reporte privado + dashboard público)
        working-directory: tid-max/software
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Agregador (Junction) — OPCIONAL. Agrega estos SECRETS para activar el sync
          # automatico en la nube. Si faltan (o no hay atletas conectados), se omite.
          JUNCTION_API_KEY: ${{ secrets.JUNCTION_API_KEY }}
          JUNCTION_API_BASE: ${{ secrets.JUNCTION_API_BASE }}
          JUNCTION_ENV: ${{ secrets.JUNCTION_ENV }}
          JUNCTION_REGION: ${{ secrets.JUNCTION_REGION }}
        run: |
          # tid_multi.py recorre atletas.json: por CADA atleta baja su fuente (WHOOP /
          # Polar / agregador) AISLADA en su carpeta, genera su reporte privado
          # (reportes/<slug>.json) y refresca el dashboard público (web+app data.json)
          # desde el atleta primario (Gael). Es defensivo: si a un atleta le falta su
          # fuente, se omite sin romper a los demás ni al dashboard actual.
          python tid_multi.py

      # IMPORTANTE: primero PUBLICAR el reporte (es el artefacto valioso), y HASTA DESPUÉS
      # reguardar el token. Antes iba al revés: si el guardado del token fallaba (p. ej. un
      # 503 transitorio de GitHub), el commit del reporte se saltaba y el reporte se congelaba.
      - name: Publicar los reportes (commit de data.json + reportes por atleta)
        run: |
          git config user.name  "tid-max-bot"
          git config user.email "bot@tid-max.local"
          # Dashboard público (web + app) y los reportes PRIVADOS por atleta.
          git add tid-max/web/data.json tid-max/app/data.json tid-max/software/reportes
          if git diff --staged --quiet; then
            echo "Sin cambios (¿ya corrió hoy?)."
          else
            git commit -m "Reporte diario TID-MAX ($(date -u +%F))"
            git push
          fi

      - name: Reguardar el refresh token rotado (WHOOP lo rota en cada sync)
        if: ${{ always() && env.GH_PAT != '' }}
        working-directory: tid-max/software
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          VIEJO: ${{ secrets.WHOOP_REFRESH_TOKEN }}
        run: |
          NUEVO=$(python -c "from dotenv import dotenv_values; print(dotenv_values('.env').get('WHOOP_REFRESH_TOKEN',''))")
          if [ -z "$NUEVO" ] || [ "$NUEVO" = "$VIEJO" ]; then
            echo "El token no cambió; nada que actualizar."
            exit 0
          fi
          echo "Token WHOOP rotó — actualizando el secret (con reintentos ante 503)…"
          for intento in 1 2 3 4 5; do
            if gh secret set WHOOP_REFRESH_TOKEN --body "$NUEVO" --repo "${{ github.repository }}"; then
              echo "Secret actualizado en el intento $intento."
              exit 0
            fi
            echo "Intento $intento falló (posible 503 transitorio). Reintentando…"
            sleep $((intento * 3))
          done
          echo "::error::No pude reguardar el token WHOOP tras 5 intentos. Si el reporte se congela, re-autoriza WHOOP con whoop_auth.py y actualiza el secret WHOOP_REFRESH_TOKEN."
          exit 1

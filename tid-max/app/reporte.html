<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A0E14" id="metaTheme">
<title>Reporte del día — TID-MAX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<script>
/* Mismo tema que la app (localStorage tidmax_theme: auto | light | dark) */
(function(){ try{
  var t = localStorage.getItem("tidmax_theme") || "auto";
  var root = document.documentElement;
  if(t==="auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  var dark = t==="dark" || (t!=="light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  var m = document.getElementById("metaTheme"); if(m) m.setAttribute("content", dark ? "#05080D" : "#F5F7F9");
}catch(e){} })();
</script>
<style>
  /* Paleta clara (base) — se sobreescribe a oscuro abajo. Dark es el look "hero". */
  :root{
    --ground:#EEF2F6; --panel:#FFFFFF; --panel2:#F6F9FC; --track:#E4EAF1; --line:#E2E8EF;
    --ink:#101722; --dim:#5A6B7D; --faint:#8496A8;
    --accent:#4F7A00; --good:#12936A; --warn:#C67E00; --bad:#DB3A44;
    --rec:#E0812B; --hrv:#7A52E0; --sleep:#0F9AB0; --strain:#2AA277;
    --shadow:0 1px 0 rgba(0,0,0,.02),0 14px 34px rgba(20,50,70,.10);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ground:#05080D; --panel:#101825; --panel2:#0c131e; --track:#1a2433; --line:#1f2b3a;
    --ink:#eef4fb; --dim:#8b9bb0; --faint:#59697f;
    --accent:#C6FF3D; --good:#37d29a; --warn:#f6b543; --bad:#ff5661;
    --rec:#f6b543; --hrv:#8a5cf0; --sleep:#37c8d4; --strain:#37d29a;
    --shadow:0 0 0 1px rgba(255,255,255,.03),0 18px 40px rgba(0,0,0,.55);
  } }
  :root[data-theme="dark"]{
    --ground:#05080D; --panel:#101825; --panel2:#0c131e; --track:#1a2433; --line:#1f2b3a;
    --ink:#eef4fb; --dim:#8b9bb0; --faint:#59697f;
    --accent:#C6FF3D; --good:#37d29a; --warn:#f6b543; --bad:#ff5661;
    --rec:#f6b543; --hrv:#8a5cf0; --sleep:#37c8d4; --strain:#37d29a;
    --shadow:0 0 0 1px rgba(255,255,255,.03),0 18px 40px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);background:var(--ground);
    font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 16px 70px}
  .num,.mono{font-family:"Rajdhani","Manrope",sans-serif;font-variant-numeric:tabular-nums}

  /* Header */
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .top .h{font-family:"Rajdhani";font-size:30px;font-weight:700;letter-spacing:.01em;line-height:1.05}
  .top .sub{color:var(--dim);font-size:13.5px;margin-top:5px}
  .top .sub b{color:var(--ink)}
  a.back{color:var(--accent);text-decoration:none;font-weight:700;font-size:14px;font-family:"Rajdhani";white-space:nowrap}

  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 4px}
  .kpi{border-radius:18px;padding:16px 16px 15px;color:#0b0f16;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .kpi .l{font-family:"Rajdhani";font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.72}
  .kpi .v{font-family:"Rajdhani";font-weight:700;font-size:38px;line-height:1;margin-top:6px}
  .kpi .v small{font-size:16px;font-weight:600;opacity:.7}
  .kpi .b{display:inline-block;margin-top:10px;font-size:11.5px;font-weight:800;font-family:"Rajdhani";
    letter-spacing:.02em;background:rgba(0,0,0,.16);border-radius:999px;padding:3px 10px}
  .kpi.rec{background:linear-gradient(150deg,#e7a636,#c98120)}
  .kpi.hrv{background:linear-gradient(150deg,#7d5be6,#5b39c6)}
  .kpi.slp{background:linear-gradient(150deg,#20b6c6,#0f8ea8)}
  .kpi.str{background:linear-gradient(150deg,#37d29a,#1f9e70)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:20px;padding:18px 18px;box-shadow:var(--shadow)}
  .card h2{font-family:"Rajdhani";font-size:17px;margin:0 0 2px;font-weight:700;display:flex;align-items:center;gap:8px}
  .card .muted{color:var(--dim);font-size:12.5px;margin-bottom:12px;font-weight:500}

  /* Fila con barra de progreso + rango + pill (como el export) */
  .m{padding:12px 0;border-top:1px solid var(--line)}
  .m:first-of-type{border-top:0;padding-top:2px}
  .m .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .m .name{color:var(--dim);font-size:13.5px;font-weight:600}
  .m .val{font-family:"Rajdhani";font-weight:700;font-size:19px;text-align:right}
  .m .val small{font-size:12px;color:var(--dim);font-weight:600}
  .bar{height:9px;border-radius:999px;background:var(--track);margin-top:9px;overflow:hidden}
  .bar > span{display:block;height:100%;border-radius:999px}
  .m .rng{display:flex;justify-content:space-between;gap:10px;margin-top:6px;align-items:center}
  .m .rng .cap{font-size:10.5px;color:var(--faint)}
  .pill{font-family:"Rajdhani";font-weight:700;font-size:11px;letter-spacing:.02em;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .p-good{color:var(--good);background:color-mix(in srgb,var(--good) 16%,transparent)}
  .p-warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
  .p-bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}

  /* Fila simple clave-valor (siesta, etc.) */
  .kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
  .kv:first-of-type{border-top:0}
  .kv .kk{color:var(--dim)} .kv .vv{font-family:"Rajdhani";font-weight:700;font-size:15px}
  .sub-h{font-family:"Rajdhani";font-weight:700;font-size:13px;color:var(--ink);margin:14px 0 2px;display:flex;gap:7px;align-items:center}

  /* Coach / recomendación */
  .coach{position:relative;padding-left:16px;margin-top:2px}
  .coach::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;border-radius:4px;background:linear-gradient(180deg,var(--rec),var(--warn))}
  .coach p{font-size:14px;line-height:1.55;color:var(--ink);margin:0}
  .rec-line{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink)}
  .rec-line:first-of-type{border-top:0}

  .foot{color:var(--faint);font-size:11.5px;margin-top:22px;text-align:center;line-height:1.6}
  .loading{color:var(--dim);text-align:center;padding:70px 20px;font-family:"Rajdhani";font-size:16px}
  @media (max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr)} .grid2{grid-template-columns:1fr} .top .h{font-size:25px} }
</style></head>
<body>
<div class="wrap"><div id="app"><div class="loading">Cargando tu reporte…</div></div></div>
<script>
var TOKEN_KEY="tid_token";
function tok(){ try{ return (localStorage.getItem(TOKEN_KEY)||"").trim(); }catch(e){ return ""; } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function isN(v){ return typeof v==="number" && !isNaN(v); }
function n1(v){ return isN(v)? (Math.round(v*10)/10):"—"; }
function n0(v){ return isN(v)? Math.round(v):"—"; }
function pctTxt(v){ return isN(v)?((v>0?"+":"")+v+"%"):""; }
function hm(h){ if(!isN(h)) return "—"; var m=Math.round(h*60); return (Math.floor(m/60))+"h "+String(m%60).padStart(2,"0")+"m"; }
function clamp(v){ return Math.max(0,Math.min(100,v)); }

/* pill(estado): 'good'|'warn'|'bad' + texto */
function pill(txt,cls){ return '<span class="pill p-'+cls+'">'+esc(txt)+'</span>'; }
/* barra: fill 0-100 + color css */
function barEl(fill,color){ return '<div class="bar"><span style="width:'+clamp(fill).toFixed(0)+'%;background:'+color+'"></span></div>'; }

/* Métrica con barra + rango + pill. color = gradiente/color css del fill. */
function metric(name, valHtml, fill, color, cap, pillHtml){
  return '<div class="m"><div class="head"><div class="name">'+esc(name)+'</div>'
    +'<div class="val">'+valHtml+'</div></div>'
    + barEl(fill,color)
    + '<div class="rng"><div class="cap">'+esc(cap||"")+'</div>'+(pillHtml||"")+'</div></div>';
}
function kv(k,v){ return '<div class="kv"><span class="kk">'+esc(k)+'</span><span class="vv">'+v+'</span></div>'; }

var GRAD={
  rec:"linear-gradient(90deg,#e0524a,#e7a636)", hrv:"linear-gradient(90deg,#5b39c6,#8a5cf0)",
  sleep:"linear-gradient(90deg,#0f8ea8,#37c8d4)", green:"linear-gradient(90deg,#1f9e70,#37d29a)",
  cool:"linear-gradient(90deg,#4b73c9,#8fb0f0)", warm:"linear-gradient(90deg,#c98120,#f6b543)"
};

function render(d){
  d=d||{};
  var s=d.sueno||{}, h=d.hrv||{}, rh=d.rhr||{}, fo=d.forma||{}, vi=d.vitales||{}, nu=d.nutricion||{};
  var noche = isN(s.noche_h)?s.noche_h:s.total_h;
  var html='';

  // ---- Header ----
  var ev='';
  if(d.evento && String(d.evento).toLowerCase()!=="el evento"){
    if(isN(d.dias_al_evento) && d.dias_al_evento<0){
      ev = esc(d.evento) + ' · post-evento';           // ya pasó: no mostramos días negativos
    } else {
      ev = esc(d.evento) + (isN(d.dias_al_evento)?': '+d.dias_al_evento+' días':'')
         + (isN(d.dias_al_viaje)&&d.dias_al_viaje>=0?' · vuela en '+d.dias_al_viaje+' días':'');
    }
  }
  html+='<div class="top"><div>'
     +'<div class="h">'+esc(d.atleta||"Atleta")+' — Reporte del día</div>'
     +'<div class="sub"><b>'+esc(d.fecha_texto||d.fecha||"")+'</b>'+(ev?' · '+ev:'')+'</div>'
     +'</div><a class="back" href="./">‹ Volver a la app</a></div>';

  // ---- KPIs ----
  var recBadge = isN(d.recovery)? (d.recovery>=67?"🟢 Verde":d.recovery>=34?"🟡 Amarillo":"🔴 Rojo") : "";
  html+='<div class="kpis">'
     +'<div class="kpi rec"><div class="l">Recovery</div><div class="v num">'+n0(d.recovery)+'<small>%</small></div><div class="b">'+esc(recBadge)+'</div></div>'
     +'<div class="kpi hrv"><div class="l">HRV</div><div class="v num">'+n1(h.ms)+'<small>ms</small></div><div class="b">FC reposo '+n0(rh.lpm)+' lpm</div></div>'
     +'<div class="kpi slp"><div class="l">Sueño real</div><div class="v num">'+hm(noche)+'</div><div class="b">Performance '+n0(s.perf)+'%</div></div>'
     +'<div class="kpi str"><div class="l">Strain del día</div><div class="v num">'+n1(vi.strain)+'</div><div class="b">meta '+n0(nu.meta)+' kcal</div></div>'
     +'</div>';

  html+='<div class="grid2">';

  // ---- Recovery y señales vitales ----
  var v='<div class="card"><h2>❤️ Recovery y señales vitales</h2><div class="muted">con rango óptimo</div>';
  v+=metric("Recovery", n0(d.recovery)+'%', d.recovery, GRAD.rec,
       "≥ 67% verde / 34–66% amarillo / < 34% rojo",
       isN(d.recovery)?pill(recBadge.replace(/^..\s/,""), d.recovery>=67?"good":d.recovery>=34?"warn":"bad"):"");
  if(isN(h.ms)){ var hrvOk=h.ms>=70&&h.ms<=140;
    v+=metric("HRV", n1(h.ms)+' <small>ms</small>', clamp(h.ms/140*100), GRAD.hrv,
       "70–120 ms óptimo"+(isN(h.base)?" · base ~"+n0(h.base):"")+(isN(h.vs_base_pct)?" · "+pctTxt(h.vs_base_pct):""),
       pill(hrvOk?"Óptima":"Vigilar", hrvOk?"good":"warn")); }
  if(isN(rh.lpm)){ var rhOk=rh.lpm>=42&&rh.lpm<=58;
    v+=metric("FC reposo", n0(rh.lpm)+' <small>lpm</small>', clamp((70-rh.lpm)/(70-38)*100), GRAD.green,
       "42–58 lpm (nadadores élite)"+(isN(rh.vs_base_pct)?" · "+pctTxt(rh.vs_base_pct):""),
       pill(rhOk?"Óptima":rh.lpm<=62?"Aceptable":"Alta", rhOk?"good":rh.lpm<=62?"warn":"bad")); }
  if(isN(vi.spo2)){ var sp=vi.spo2;
    v+=metric("SpO₂", n1(sp)+' <small>%</small>', clamp((sp-88)/(100-88)*100), GRAD.sleep,
       "≥ 95% óptimo / 93–94% aceptable / < 93% bajo",
       pill(sp>=95?"Óptima":sp>=93?"Aceptable":"Baja", sp>=95?"good":sp>=93?"warn":"bad")); }
  if(isN(vi.temp_piel)){
    v+=metric("Temp. piel", n1(vi.temp_piel)+' <small>°C</small>', 55, GRAD.warm,
       "±0.5 °C de su baseline — alertar si sube > 0.8 °C", ""); }
  v+='</div>';
  html+=v;

  // ---- Sueño completo ----
  var rem= isN(s.rem_pct)&&isN(noche)? noche*s.rem_pct/100 : null;
  var deep= isN(s.deep_pct)&&isN(noche)? noche*s.deep_pct/100 : null;
  var lig= (isN(noche)&&isN(rem)&&isN(deep))? Math.max(0,noche-rem-deep) : null;
  var cama= (isN(noche)&&isN(s.efic)&&s.efic>0)? noche/(s.efic/100) : null;
  var sl='<div class="card"><h2>😴 Sueño completo</h2><div class="muted">con rango óptimo</div>';
  if(s.acostado||s.despertar) sl+=kv("Horario", esc(s.acostado||"—")+' → '+esc(s.despertar||"—"));
  if(isN(cama)) sl+=metric("Tiempo en cama", hm(cama), clamp(cama/9.5*100), GRAD.sleep, "8–9.5 h en cama",
       pill(cama>=8?"Extendido":"Corto", cama>=8?"good":"warn"));
  sl+=metric("Sueño real", hm(noche)+(isN(s.despertares)?' <small>('+n0(s.despertares)+' interrupciones)</small>':''),
       clamp(noche/8*100), GRAD.sleep, "≥ 8 h sueño real / < 8 interrupciones",
       pill(noche>=8?"Óptimo":"Corto", noche>=8?"good":"warn"));
  if(isN(rem)) sl+=metric("REM", hm(rem), clamp(rem/2.5*100), GRAD.hrv, "1h 45m–2h 30m", pill(rem>=1.75?"Óptimo":"Bajo", rem>=1.75?"good":"warn"));
  if(isN(deep)) sl+=metric("Profundo", hm(deep), clamp(deep/2.5*100), GRAD.cool, "≥ 1h 30m", pill(deep>=1.5?"Óptimo":"Bajo", deep>=1.5?"good":"warn"));
  if(isN(lig)) sl+=metric("Ligero", hm(lig), clamp(lig/noche*100), GRAD.green, "50–60% del sueño total", "");
  if(isN(vi.resp_rate)) sl+=metric("Respiración nocturna", n1(vi.resp_rate)+' <small>rpm</small>',
       clamp((vi.resp_rate-10)/(22-10)*100), GRAD.sleep, "12–15 rpm óptimo / 15–17 aceptable / > 17 alta",
       pill(vi.resp_rate<=15?"Óptimo":vi.resp_rate<=17?"Aceptable":"Alta", vi.resp_rate<=15?"good":vi.resp_rate<=17?"warn":"bad"));
  if(isN(s.perf)) sl+=metric("Performance", n0(s.perf)+'%', s.perf, GRAD.rec, "≥ 85% ideal / 70–84% aceptable",
       pill(s.perf>=85?"Ideal":s.perf>=70?"Aceptable":"Bajo", s.perf>=85?"good":s.perf>=70?"warn":"bad"));
  if(isN(s.consist)) sl+=metric("Consistencia horaria", n0(s.consist)+'%', s.consist, GRAD.warm, "≥ 75% ideal",
       pill(s.consist>=75?"Buena":"Baja", s.consist>=75?"good":"warn"));
  if(isN(s.deuda_min)) sl+=metric("Deuda de sueño", n0(s.deuda_min)+' <small>min</small>', clamp(s.deuda_min/240*100), GRAD.warm,
       "< 30 min ideal", pill(s.deuda_min<30?"Baja":s.deuda_min<120?"Moderada":"Alta", s.deuda_min<30?"good":s.deuda_min<120?"warn":"bad"));
  // Siesta
  if(isN(s.siesta_h)&&s.siesta_h>0){
    sl+='<div class="sub-h">😴 Siesta'+(isN(s.n_siestas)&&s.n_siestas>1?' ('+n0(s.n_siestas)+')':'')+'</div>';
    sl+=kv("Duración", hm(s.siesta_h));
  }
  sl+='</div>';
  html+=sl;
  html+='</div>'; // grid2

  // ---- Strain y energía + Comidas ----
  html+='<div class="grid2">';
  var en='<div class="card"><h2>💪 Strain y energía</h2><div class="muted">con referencia</div>';
  en+=metric("Strain del día", n1(vi.strain), isN(vi.strain)?clamp(vi.strain/21*100):0, GRAD.green,
       "Fuerte 14–18 / Moderado 10–13 / Recuperación < 10", "");
  if(isN(nu.meta)) en+=kv("Meta calórica", n0(nu.meta)+' kcal');
  if(isN(nu.consumido)) en+=kv("Consumido", n0(nu.consumido)+' kcal');
  en+='</div>';
  html+=en;

  // Comidas
  var co='<div class="card"><h2>🍽️ Comidas del día</h2><div class="muted">valorado por el agente de nutrición</div>';
  if(isN(nu.consumido)&&isN(nu.meta)){
    co+=metric("Consumido", n0(nu.consumido)+' / '+n0(nu.meta)+' kcal', clamp(nu.consumido/nu.meta*100), GRAD.warm,
       Math.round((nu.consumido/nu.meta)*100)+"% de la meta", "");
  }
  if(isN(nu.c)) co+=metric("Carbohidratos", n0(nu.c)+' g', 100, GRAD.warm, "objetivo del día", "");
  if(isN(nu.p)) co+=metric("Proteína", n0(nu.p)+' g', 100, GRAD.hrv, "objetivo del día", "");
  if(isN(nu.g)) co+=metric("Grasa", n0(nu.g)+' g', 100, GRAD.cool, "objetivo del día", "");
  var cm=(nu.comidas||[]).filter(function(x){return x;});
  if(cm.length){ co+='<div class="sub-h">Registro de comidas</div>';
    cm.forEach(function(m){ co+=kv(esc(m.tipo||m.nombre||"Comida"), (isN(m.kcal)?n0(m.kcal)+' kcal':'')); }); }
  else { co+='<div class="kv" style="color:var(--faint)"><span class="kk">Aún sin comidas registradas hoy</span><span></span></div>'; }
  co+='</div>';
  html+=co;
  html+='</div>'; // grid2

  // ---- Recomendación del día ----
  if(d.semaforo_desc || fo.lectura || (d.alertas||[]).length){
    html+='<div class="card" style="margin-top:14px"><h2>🎯 Recomendación del día</h2>';
    if(d.semaforo_desc) html+='<div class="coach"><p>'+esc(d.semaforo_desc)+'</p></div>';
    (d.alertas||[]).forEach(function(a){ if(a&&a.texto) html+='<div class="rec-line">⚠️ <div>'+esc(a.texto)+'</div></div>'; });
    html+='</div>';
  }

  html+='<div class="foot">'+esc(d.nota_datos||"Datos WHOOP + motor TID-MAX · las zonas de FC y el plan de taper se muestran cuando hay prueba de laboratorio y plan cargados.")+'</div>';

  document.getElementById("app").innerHTML=html;
}

function errorBox(msg){
  document.getElementById("app").innerHTML='<div class="loading">'+esc(msg)+'<br><a class="back" href="./" style="display:inline-block;margin-top:14px">‹ Volver a la app</a></div>';
}

// Carga EN VIVO por atleta: si hay sesión, /api/me (tu reporte); si no, data.json (público).
(function(){
  var t=tok();
  if(t){
    fetch("/api/me",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token:t})})
      .then(function(r){
        if(r.ok) return r.json().then(function(j){ render(j.data); });
        if(r.status===401){ try{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem("tid_session");}catch(e){} errorBox("Tu sesión expiró. Entra de nuevo en la app."); return; }
        return r.json().catch(function(){return {};}).then(function(j){ errorBox((j&&j.error)||"Aún no hay reporte para tu cuenta."); });
      })
      .catch(function(){ errorBox("Sin conexión. Reintenta."); });
  } else {
    fetch("./data.json?v="+Date.now())
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(render)
      .catch(function(e){ errorBox("No pude cargar el reporte: "+e.message); });
  }
})();
</script>
</body></html>

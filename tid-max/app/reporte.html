<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F7F9" id="metaTheme">
<title>Reporte del día — TID-MAX</title>
<script>
/* Mismo tema que la app (localStorage tidmax_theme: auto | light | dark) */
(function(){ try{
  var t = localStorage.getItem("tidmax_theme") || "auto";
  var root = document.documentElement;
  if(t==="auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", t);
  var dark = t==="dark" || (t!=="light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  var m = document.getElementById("metaTheme"); if(m) m.setAttribute("content", dark ? "#0A0E14" : "#F5F7F9");
}catch(e){} })();
</script>
<style>
:root{
  --ground:#F5F7F9; --panel:#FFFFFF; --panel2:#EDF1F5; --line:#E2E8EF;
  --ink:#101722; --dim:#5A6B7D; --faint:#93A2B4;
  --accent:#B4EF2E; --accent-ink:#4F7A00;
  --good:#12936A; --warn:#C67E00; --crit:#DB3A44;
  --shadow:0 1px 0 rgba(0,0,0,.02),0 12px 30px rgba(20,50,70,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0A0E14; --panel:#121822; --panel2:#18202c; --line:#26303f;
  --ink:#eef3f8; --dim:#93a2b5; --faint:#63728a;
  --accent:#C6FF3D; --accent-ink:#C6FF3D; --good:#37d29a; --warn:#f6b543; --crit:#ff5a60;
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 14px 34px rgba(0,0,0,.55);
} }
:root[data-theme="dark"]{
  --ground:#0A0E14; --panel:#121822; --panel2:#18202c; --line:#26303f;
  --ink:#eef3f8; --dim:#93a2b5; --faint:#63728a;
  --accent:#C6FF3D; --accent-ink:#C6FF3D; --good:#37d29a; --warn:#f6b543; --crit:#ff5a60;
  --shadow:0 0 0 1px rgba(255,255,255,.04),0 14px 34px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--ground);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.h{font-size:24px;font-weight:800;letter-spacing:-.3px}
.sub{color:var(--dim);font-size:13.5px;margin-top:4px}
a.back{color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow)}
.kpi .l{font-size:10.5px;letter-spacing:.06em;color:var(--faint);text-transform:uppercase;font-weight:700}
.kpi .v{font-size:23px;font-weight:800;margin-top:3px}
.kpi .v small{font-size:12px;color:var(--dim);font-weight:600}
.kpi .b{font-size:11px;font-weight:700;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 3px;font-weight:800}
.card .muted{color:var(--dim);font-size:12.5px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .k{color:var(--dim);font-size:14px}
.row .val{font-weight:800;font-size:15px;text-align:right}
.row .val small{color:var(--dim);font-weight:600;font-size:12px}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px}
.b-good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.b-warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.b-crit{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
.coach{font-size:14.5px;line-height:1.55}
.alert{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.alert:first-of-type{border-top:0}
.foot{color:var(--faint);font-size:12px;margin-top:20px;text-align:center}
.loading{color:var(--dim);text-align:center;padding:60px 20px}
</style></head>
<body>
<div class="wrap"><div id="app"><div class="loading">Cargando tu reporte…</div></div></div>
<script>
var TOKEN_KEY="tid_token";
function tok(){ try{ return (localStorage.getItem(TOKEN_KEY)||"").trim(); }catch(e){ return ""; } }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function num(v,d){ return (v==null||v==="")?"—":(typeof v==="number"?(d!=null?v.toFixed(d):v):v); }
function pct(v){ if(v==null) return ""; return (v>0?"+":"")+v+"%"; }

// Rango → badge (good/warn/crit) según umbrales simples por métrica.
function badge(txt,cls){ return '<span class="badge '+cls+'">'+esc(txt)+'</span>'; }
function recBadge(r){ if(r==null) return ""; return r>=67?badge("Verde","b-good"):r>=34?badge("Amarillo","b-warn"):badge("Rojo","b-crit"); }
function spoBadge(v){ if(v==null) return ""; return v>=95?badge("Óptima","b-good"):v>=93?badge("Aceptable","b-warn"):badge("Baja","b-crit"); }

function row(k,val,sub,bdg){
  return '<div class="row"><div class="k">'+esc(k)+'</div><div class="val">'+val
    +(sub?' <small>'+esc(sub)+'</small>':'')+(bdg||'')+'</div></div>';
}

function render(d){
  var s=d.sueno||{}, h=d.hrv||{}, rh=d.rhr||{}, fo=d.forma||{}, vi=d.vitales||{};
  var evTxt = d.evento && d.evento!=="el evento"
     ? esc(d.evento)+(d.dias_al_evento!=null?' · '+d.dias_al_evento+' días':'') : '';
  var html='';
  html+='<div class="top"><div>'
      +'<div class="h">'+esc(d.atleta||"Atleta")+'</div>'
      +'<div class="sub">'+esc(d.fecha_texto||d.fecha||"")+(evTxt?' · '+evTxt:'')+'</div>'
      +'</div><a class="back" href="./">‹ Volver</a></div>';

  // KPIs
  html+='<div class="kpis">'
      +'<div class="kpi"><div class="l">Recovery</div><div class="v">'+num(d.recovery)+'<small>%</small></div><div class="b">'+recBadge(d.recovery)+'</div></div>'
      +'<div class="kpi"><div class="l">HRV</div><div class="v">'+num(h.ms)+'<small>ms</small></div><div class="b" style="color:var(--dim)">'+esc(pct(h.vs_base_pct))+' vs base</div></div>'
      +'<div class="kpi"><div class="l">Sueño</div><div class="v">'+num(s.total_h)+'<small>h</small></div><div class="b" style="color:var(--dim)">'+num(s.perf)+'% perf</div></div>'
      +'<div class="kpi"><div class="l">Strain</div><div class="v">'+num(vi.strain)+'</div><div class="b" style="color:var(--dim)">del día</div></div>'
      +'</div>';

  // Veredicto / coach
  if(d.semaforo_desc||fo.lectura){
    html+='<div class="card"><h2 style="color:var(--accent-ink)">Coach de hoy</h2>';
    if(d.semaforo_desc) html+='<div class="coach">'+esc(d.semaforo_desc)+'</div>';
    if(fo.lectura) html+='<div class="coach" style="margin-top:8px;color:var(--dim)">'+esc(fo.lectura)+'</div>';
    html+='</div>';
  }

  // Vitales
  html+='<div class="card"><h2>Recovery y señales vitales</h2><div class="muted">Del WHOOP del día</div>';
  html+=row("Recovery", num(d.recovery)+'%', null, recBadge(d.recovery));
  html+=row("HRV", num(h.ms)+' ms', (h.base!=null?'base '+num(h.base):'')+(h.vs_base_pct!=null?' · '+pct(h.vs_base_pct):''));
  html+=row("FC reposo", num(rh.lpm)+' lpm', (rh.base!=null?'base '+num(rh.base):'')+(rh.vs_base_pct!=null?' · '+pct(rh.vs_base_pct):''));
  if(vi.spo2!=null) html+=row("SpO₂", num(vi.spo2)+'%', null, spoBadge(vi.spo2));
  if(vi.temp_piel!=null) html+=row("Temp. piel", num(vi.temp_piel,1)+' °C');
  if(vi.resp_rate!=null) html+=row("Respiración", num(vi.resp_rate,1)+' rpm');
  html+='</div>';

  // Sueño
  html+='<div class="card"><h2>Sueño</h2><div class="muted">El total suma las siestas</div>';
  html+=row("Dormido", num(s.total_h)+' h', (s.noche_h!=null?num(s.noche_h)+' h noche':'')+(s.siesta_h?' + '+num(s.siesta_h)+' h siesta':''));
  html+=row("Performance", num(s.perf)+'%', (s.perf_prom_7d!=null?'7d '+num(s.perf_prom_7d)+'%':''));
  if(s.efic!=null) html+=row("Eficiencia", num(s.efic)+'%');
  if(s.deep_pct!=null||s.rem_pct!=null) html+=row("Profundo / REM", num(s.deep_pct)+'% / '+num(s.rem_pct)+'%');
  if(s.consist!=null) html+=row("Consistencia", num(s.consist)+'%');
  if(s.despertares!=null) html+=row("Despertares", num(s.despertares));
  if(s.deuda_min!=null) html+=row("Deuda de sueño", num(s.deuda_min)+' min');
  if(s.acostado||s.despertar) html+=row("Horario", esc((s.acostado||"—"))+' → '+esc((s.despertar||"—")));
  html+='</div>';

  // Forma
  if(fo.ctl!=null||fo.tsb!=null){
    html+='<div class="card"><h2>Forma (carga)</h2><div class="muted">Proxy sobre el strain de WHOOP — lee la tendencia</div>';
    html+=row("Fitness (CTL)", num(fo.ctl,1));
    html+=row("Fatiga (ATL)", num(fo.atl,1));
    html+=row("Forma (TSB)", num(fo.tsb,1), (fo.tsb_previa!=null?'previa '+num(fo.tsb_previa,1):''));
    if(fo.estado_pico) html+=row("Estado", esc(fo.estado_pico));
    html+='</div>';
  }

  // Alertas
  var al=(d.alertas||[]).filter(function(a){return a&&a.texto;});
  if(al.length){
    html+='<div class="card"><h2>Señales a vigilar</h2>';
    al.forEach(function(a){ html+='<div class="alert">⚠️ <div>'+esc(a.texto)+'</div></div>'; });
    html+='</div>';
  }

  html+='<div class="foot">'+esc(d.nota_datos||"Fuente: WHOOP + motor TID-MAX.")+'</div>';
  document.getElementById("app").innerHTML=html;
}

function errorBox(msg){
  document.getElementById("app").innerHTML='<div class="loading">'+esc(msg)+'<br><a class="back" href="./" style="display:inline-block;margin-top:12px">‹ Volver a la app</a></div>';
}

// Carga EN VIVO por atleta: si hay sesión, /api/me (tu reporte); si no, data.json (público).
(function(){
  var t=tok();
  if(t){
    fetch("/api/me",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token:t})})
      .then(function(r){
        if(r.ok) return r.json().then(function(j){ render(j.data); });
        if(r.status===401){ try{localStorage.removeItem(TOKEN_KEY);localStorage.removeItem("tid_session");}catch(e){} errorBox("Tu sesión expiró. Entra de nuevo en la app."); return; }
        return r.json().catch(function(){return {};}).then(function(j){ errorBox((j&&j.error)||"Aún no hay reporte para tu cuenta."); });
      })
      .catch(function(){ errorBox("Sin conexión. Reintenta."); });
  } else {
    fetch("./data.json?v="+Date.now())
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(render)
      .catch(function(e){ errorBox("No pude cargar el reporte: "+e.message); });
  }
})();
</script>
</body></html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E14" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TID-MAX">
<link rel="manifest" href="./manifest.webmanifest">
<title>TID-MAX</title>
<style>
  /* ===================== TEMA ===================== */
  /* DÍA (claro) = default */
  :root{
    --ground:#F5F7F9; --panel:#FFFFFF; --panel2:#EDF1F5; --raise:#E7ECF1; --line:#E2E8EF;
    --ink:#101722; --dim:#5A6B7D; --faint:#93A2B4;
    --accent:#B4EF2E; --accent2:#8FD400; --on-accent:#16210A; --accent-ink:#4F7A00;
    --good:#12936A; --warn:#C67E00; --crit:#DB3A44;
    --tabbar:rgba(255,255,255,.9);
  }
  /* NOCHE automática: cuando el dispositivo está en oscuro y NO se forzó claro */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#0A0E14; --panel:#121822; --panel2:#18202c; --raise:#1e2a38; --line:#26303f;
      --ink:#eef3f8; --dim:#93a2b5; --faint:#63728a;
      --accent:#C6FF3D; --accent2:#8FD400; --on-accent:#0f1a00; --accent-ink:#C6FF3D;
      --good:#37d29a; --warn:#f6b543; --crit:#ff5a60;
      --tabbar:rgba(18,24,34,.92);
    }
  }
  /* NOCHE forzada manual */
  :root[data-theme="dark"]{
    --ground:#0A0E14; --panel:#121822; --panel2:#18202c; --raise:#1e2a38; --line:#26303f;
    --ink:#eef3f8; --dim:#93a2b5; --faint:#63728a;
    --accent:#C6FF3D; --accent2:#8FD400; --on-accent:#0f1a00; --accent-ink:#C6FF3D;
    --good:#37d29a; --warn:#f6b543; --crit:#ff5a60;
    --tabbar:rgba(18,24,34,.92);
  }
  /* ================================================ */

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;transition:background .2s,color .2s}
  .app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
  .view{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 92px;-webkit-overflow-scrolling:touch}
  .num{font-variant-numeric:tabular-nums}
  /* header */
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .top .h{font-size:21px;font-weight:800}
  .top .s{font-size:12px;color:var(--dim);margin-top:1px}
  .tid{width:40px;height:40px;border-radius:11px;flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:var(--on-accent);font-weight:800;font-size:13px}
  .back{width:34px;height:34px;border-radius:10px;flex:none;background:var(--panel2);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--dim);font-size:18px;cursor:pointer}
  /* cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px 16px;margin-bottom:12px}
  .tap{cursor:pointer;transition:border-color .15s}
  .tap:active{border-color:var(--accent)}
  .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .dot{width:48px;height:48px;border-radius:50%;flex:none}
  .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
  .m{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 10px;text-align:center}
  .mv{font-size:23px;font-weight:800}
  .mv .u{font-size:12px;color:var(--dim);font-weight:600}
  .ml{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:14px;font-weight:800;font-size:15px;border:none;cursor:pointer;font-family:inherit}
  .btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent)}
  .btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line);margin-top:10px}
  .pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
  .pill.ok{color:var(--on-accent);background:var(--good)}
  .pill.go{color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 16%,transparent);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}
  .src{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .src .ic{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px}
  .src .nm{font-weight:700;font-size:14.5px}
  .src .sub{font-size:11.5px;color:var(--dim);margin-top:1px}
  .plan{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .plan .e{font-size:20px}
  .plan .t{font-size:13.5px;font-weight:700}
  .plan .d{font-size:12px;color:var(--dim);margin-top:1px}
  .hint{font-size:12px;color:var(--dim);line-height:1.5}
  .sub-note{text-align:center;font-size:10.5px;color:var(--faint);margin-top:9px}
  /* segmented (tema/prioridad) */
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;width:100%}
  .seg button{flex:1;background:none;border:none;font-family:inherit;font-size:13px;font-weight:800;color:var(--dim);
    padding:9px 6px;border-radius:9px;cursor:pointer}
  .seg button.on{background:var(--accent);color:var(--on-accent)}
  /* formulario */
  .field{margin-bottom:13px}
  .field>label{display:block;font-size:11.5px;font-weight:700;color:var(--dim);margin-bottom:5px}
  .field>label .opt{color:var(--faint);font-weight:500}
  .inp,.selc{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:11px;
    color:var(--ink);font-family:inherit;font-size:15px;font-weight:600;padding:12px 13px}
  .inp::placeholder{color:var(--faint);font-weight:500}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
  .quick::-webkit-scrollbar{display:none}
  .qchip{flex:none;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);font-family:inherit;font-size:12px;font-weight:700;padding:8px 12px;border-radius:11px;cursor:pointer;white-space:nowrap}
  .prio{display:flex;gap:8px}
  .prio button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-family:inherit;
    font-weight:800;font-size:13px;padding:10px 4px;border-radius:11px;cursor:pointer;text-align:center;line-height:1.25}
  .prio button small{display:block;font-size:9px;font-weight:600;color:var(--faint);margin-top:2px}
  .prio button.on{color:var(--on-accent)}
  .prio button.on.A{background:var(--crit);border-color:var(--crit)}
  .prio button.on.B{background:var(--warn);border-color:var(--warn)}
  .prio button.on.C{background:var(--good);border-color:var(--good)}
  .prio button.on small{color:var(--on-accent);opacity:.85}
  /* tarjeta evento en lista */
  .ev{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:11px;position:relative;overflow:hidden}
  .ev.act{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
  .ev .rib{position:absolute;top:0;left:0;bottom:0;width:4px;background:var(--dim)}
  .ev .rib.A{background:var(--crit)} .ev .rib.B{background:var(--warn)} .ev .rib.C{background:var(--good)}
  .ev .nm{font-size:15px;font-weight:800}
  .ev .meta{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.55}
  .ev .cd{display:flex;align-items:baseline;gap:6px;margin-top:9px}
  .ev .cd .n{font-size:22px;font-weight:800;color:var(--accent-ink)}
  .ev .cd .l{font-size:11px;color:var(--dim)}
  .ev .acts{display:flex;gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
  .ev .acts button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-family:inherit;
    font-size:12px;font-weight:700;padding:9px 4px;border-radius:9px;cursor:pointer}
  .ev .acts button.del{color:var(--crit)}
  .empty{text-align:center;color:var(--faint);font-size:12.5px;padding:26px 14px;border:1px dashed var(--line);border-radius:14px;margin-bottom:12px}
  /* tab bar */
  .tabs{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;
    padding:9px 6px calc(env(safe-area-inset-bottom) + 10px);background:var(--tabbar);
    backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .tabs button{background:none;border:none;color:var(--faint);font-family:inherit;font-size:10px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:2px 12px}
  .tabs button .g{width:21px;height:21px;border-radius:7px;background:currentColor;opacity:.85}
  .tabs button.on{color:var(--accent-ink)}
  .loading{padding:70px 20px;text-align:center;color:var(--dim)}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);
    font-weight:800;font-size:13px;padding:11px 18px;border-radius:11px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
  .toast.show{opacity:1}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="view" id="view"><div class="loading">Cargando…</div></div>
  <nav class="tabs">
    <button data-tab="hoy" class="on"><span class="g"></span>Hoy</button>
    <button data-tab="entrenar"><span class="g"></span>Entrenar</button>
    <button data-tab="datos"><span class="g"></span>Datos</button>
    <button data-tab="perfil"><span class="g"></span>Perfil</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script src="./health.js"></script>
<script>
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SEMC = {verde:"--good", amarillo:"--warn", rojo:"--crit"};
let DATA = null, activeTab = "hoy", screen = null, editId = null, authMode = "login";

/* ---------------- Tema (auto + manual) ---------------- */
const THEME_KEY = "tidmax_theme";  // 'auto' | 'light' | 'dark'
function effectiveDark(t){
  if(t==="dark") return true;
  if(t==="light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function applyTheme(t){
  if(t==="auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem(THEME_KEY, t);
  document.getElementById("metaTheme").setAttribute("content", effectiveDark(t) ? "#0A0E14" : "#F5F7F9");
  document.querySelectorAll("[data-theme-btn]").forEach(b=>b.classList.toggle("on", b.dataset.themeBtn===t));
}
function getTheme(){ return localStorage.getItem(THEME_KEY) || "auto"; }
applyTheme(getTheme());
if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>{ if(getTheme()==="auto") applyTheme("auto"); });
}

/* ---------------- Eventos objetivo (localStorage) ---------------- */
const EV_KEY = "tidmax_eventos";
const SPORTS = [
  ["", "Elige un deporte…"],
  ["natacion","🏊 Natación"], ["atletismo","🏃 Atletismo / Carrera"],
  ["ciclismo","🚴 Ciclismo"], ["triatlon","🔺 Triatlón"],
  ["basquet","🏀 Básquetbol"], ["futbol","⚽ Fútbol"], ["fuerza","🏋️ Fuerza / CrossFit"],
];
const QUICK = [
  {em:"🏃",nm:"Maratón de Boston 2027",dep:"atletismo",lugar:"Boston, EE.UU.",inicio:"2027-04-19"},
  {em:"🏃",nm:"Maratón de Chicago 2027",dep:"atletismo",lugar:"Chicago, EE.UU.",inicio:"2027-10-10"},
  {em:"🏊",nm:"Pan Pacific Jr 2026",dep:"natacion",lugar:"Vancouver, Canadá",inicio:"2026-08-17"},
  {em:"🏊",nm:"Jr Nationals Natación",dep:"natacion",lugar:"",inicio:""},
  {em:"🏃",nm:"Mundial de Atletismo",dep:"atletismo",lugar:"",inicio:""},
  {em:"⚽",nm:"Copa América",dep:"futbol",lugar:"",inicio:""},
];
const loadEventos = () => { try{ return JSON.parse(localStorage.getItem(EV_KEY)||"[]"); }catch(e){ return []; } };
const saveEventos = a => localStorage.setItem(EV_KEY, JSON.stringify(a));
function labelDep(v){ return (SPORTS.find(s=>s[0]===v)||["","—"])[1]; }
function diasHasta(v){ if(!v) return null; const h=new Date(); h.setHours(0,0,0,0); const t=new Date(v+"T00:00:00"); return Math.round((t-h)/86400000); }
function fase(d){ if(d==null) return null; if(d<0) return "post-evento"; if(d<=7) return "competencia / pico"; if(d<=21) return "taper (afinamiento)"; return "carga"; }
function fmtFecha(v){ if(!v) return null; const [y,m,d]=v.split("-"); const mes=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][+m-1]; return `${+d} ${mes} ${y}`; }
function eventoActivo(){
  const evs=loadEventos().filter(e=>e.fecha_inicio);
  const fut=evs.filter(e=>diasHasta(e.fecha_inicio)>=0).sort((a,b)=>diasHasta(a.fecha_inicio)-diasHasta(b.fecha_inicio));
  return fut[0] || null;
}
function evToJSON(e){
  return {nombre:e.nombre||null, tipo_deporte:e.tipo_deporte||null, prioridad:e.prioridad||null,
    sede:e.sede||null, fecha_inicio:e.fecha_inicio||null, fecha_fin:e.fecha_fin||null,
    fecha_viaje:e.fecha_viaje||null, meta:e.meta||null};
}

/* ---------------- Fuentes (Datos) ---------------- */
const SOURCES = [
  {nm:"WHOOP", sub:"Recovery, HRV, sueño", bg:"#00b0b9", ic:"◉", prov:"whoop"},
  {nm:"Polar", sub:"FC continua · R-R (H10)", bg:"#d51e2a", ic:"●", prov:"polar"},
  {nm:"Strava", sub:"Carreras, ritmo, zonas", bg:"#fc4c02", ic:"▲", prov:"strava"},
  {nm:"Garmin", sub:"Multideporte + natación", bg:"#007cc3", ic:"◆", prov:"garmin"},
  {nm:"Oura", sub:"Sueño · recuperación", bg:"#1a1a2e", ic:"○", prov:"oura"},
  {nm:"Fitbit", sub:"Actividad · sueño", bg:"#00b0b9", ic:"◇", prov:"fitbit"},
];

/* ---------------- Vistas de pestañas ---------------- */
function vHoy(d){
  const semc = SEMC[d.semaforo]||"--warn";
  const s=d.sueno||{}, h=d.hrv||{}, fo=d.forma||{};
  const ev = eventoActivo();
  const evNombre = ev ? ev.nombre : (d.evento||"—");
  const evDias = ev ? diasHasta(ev.fecha_inicio) : (d.dias_al_evento);
  return `
  <div class="top">
    <div><div class="h">Hola, ${esc((tidSession()&&tidSession().nombre?tidSession().nombre:(d.atleta||"")).split(" ")[0]||"atleta")}</div><div class="s">${esc(d.fecha_texto||"")}</div></div>
    <div class="tid">TID</div>
  </div>
  <div class="card" style="display:flex;align-items:center;gap:13px">
    <div class="dot" style="background:radial-gradient(circle at 35% 30%, #ffffff66, var(${semc}));box-shadow:0 0 0 6px color-mix(in srgb, var(${semc}) 16%, transparent)"></div>
    <div><div class="k">Semáforo de hoy</div>
      <div style="font-size:19px;font-weight:800;margin-top:2px"><span style="color:var(${semc})">${(d.semaforo||"").toUpperCase()}</span> · ${d.recovery}%</div>
      <div class="hint" style="margin-top:2px">${esc(d.semaforo_desc||"")}</div></div>
  </div>
  <div class="mini">
    <div class="m"><div class="mv num">${d.recovery}<span class="u">%</span></div><div class="ml">Recovery</div></div>
    <div class="m"><div class="mv num">${h.ms??"—"}<span class="u">ms</span></div><div class="ml">HRV</div></div>
    <div class="m"><div class="mv num">${s.total_h??"—"}<span class="u">h</span></div><div class="ml">Sueño</div></div>
  </div>
  <div class="card">
    <div class="k" style="color:var(--accent-ink)">Coach de hoy</div>
    <div class="hint" style="color:var(--ink);margin-top:6px">${esc(fo.lectura||"—")}</div>
  </div>
  <div class="card tap" onclick="openEventos()" style="display:flex;justify-content:space-between;align-items:center">
    <div><div class="k">Evento objetivo</div><div style="font-size:14px;font-weight:700;margin-top:2px">${esc(evNombre)}</div><div class="hint" style="margin-top:2px">Toca para ver o editar</div></div>
    <div style="text-align:right"><div style="font-size:24px;font-weight:800;line-height:1" class="num">${evDias??"—"}</div><div style="font-size:10px;color:var(--dim)">días</div></div>
  </div>
  <a href="./reporte.html" class="btn pri" style="margin-top:12px;text-decoration:none;display:block">📊  Ver reporte completo</a>`;
}

function vEntrenar(d){
  const fo=d.forma||{};
  return `
  <div class="top"><div><div class="h">Tu plan de hoy</div><div class="s">Calibrado a tu readiness y al taper</div></div></div>
  <div class="card" style="border-color:color-mix(in srgb,var(--good) 34%,var(--line));background:color-mix(in srgb,var(--good) 8%,transparent)">
    <div class="k" style="color:var(--good)">Pico: ${esc((fo.estado_pico||"—").replace("_"," "))}</div>
    <div class="hint" style="color:var(--ink);margin-top:6px">${esc(fo.lectura||"—")}</div>
  </div>
  <div class="plan"><span class="e">🏊</span><div><div class="t">Entreno</div><div class="d">Sesión del día según tu plan</div></div></div>
  <div class="plan"><span class="e">😴</span><div><div class="t">Sueño</div><div class="d">Meta calibrada a tu recuperación</div></div></div>
  <div class="plan"><span class="e">🥗</span><div><div class="t">Nutrición</div><div class="d">Consumido vs meta del día</div></div></div>
  <button class="btn pri" style="margin-top:14px" onclick="openCorrer()">▶  Iniciar entrenamiento</button>
  <button class="btn sec" onclick="openSesion()">＋  Registrar sesión (multisport)</button>
  <div class="sub-note">GPS + FC en vivo · llega en la v1</div>`;
}

/* Tarjeta "Salud del teléfono" — lee el tanque del SO (Apple Salud / Health Connect) */
function healthCard(){
  const H = window.TIDHealth;
  const st = H ? H.state() : {supported:false, hub:null, enabled:false, lastSyncText:null, counts:null};
  const hub = st.hub || "Salud del teléfono";
  // Toggle según estado
  let toggle;
  if(st.demo){
    toggle = `<button class="pill" style="background:var(--warn);color:var(--on-accent);border:none;cursor:pointer;font-family:inherit" onclick="tidHealthDisconnect()">Demo ✕</button>`;
  } else if(!st.supported){
    toggle = `<button class="pill go" style="border:none;cursor:pointer;font-family:inherit" onclick="tidHealthDemo()">Ver demo</button>`;
  } else if(st.enabled){
    toggle = `<span class="pill ok">Conectado</span>`;
  } else {
    toggle = `<button class="pill go" style="border:none;cursor:pointer;font-family:inherit" onclick="tidHealthConnect()">Conectar</button>`;
  }
  // Fila de sincronización (si está conectado o en demo)
  const total = st.counts ? Object.values(st.counts).reduce((a,b)=>a+b,0) : null;
  const syncRow = st.enabled ? `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
      <div class="hint">Última sincronización: <b class="num">${st.lastSyncText||"—"}</b>${total!=null?` · ${total} reg.`:""}</div>
      <button class="pill go" style="border:none;cursor:pointer;font-family:inherit" onclick="tidHealthSync()">Sincronizar ahora</button>
    </div>` : "";
  const sub = st.demo
    ? `Simulación · así se ve conectado`
    : (st.supported ? `${esc(hub)} · FC, entrenos, HRV y sueño`
                    : `Disponible en la app instalada (iPhone / Android)`);
  const hint = st.demo
    ? `Esto es una <b>demo</b> con datos simulados para que veas la pantalla. En la app instalada, aquí entran tus datos reales de ${esc(st.hub||"Apple Salud / Health Connect")}.`
    : `Tomamos los datos que tu reloj ya deja en el teléfono (Polar, Garmin, Whoop, Samsung, Apple Watch…) — un solo enchufe para casi cualquier marca.`;
  const iconBg = st.demo ? "color-mix(in srgb,var(--warn) 18%,transparent)" : "color-mix(in srgb,var(--crit) 16%,transparent)";
  const iconFg = st.demo ? "var(--warn)" : "var(--crit)";
  return `
  <div class="card">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:17px;background:${iconBg};color:${iconFg}">♥</div>

/* Conectar una cuenta en la nube vía el agregador (Junction) — sin la Mac.
   Pide un link "Conéctate" al backend (api/connect) y lo abre para que el
   atleta haga login en SU marca. Reusa la clave de sincronización de la familia. */
async function tidConnectSource(prov, nm){
  const secret = (localStorage.getItem('tid_secret')||"").trim();
  if(!secret){ toast("Primero guarda tu clave de sincronización en Perfil."); return; }
  // Conecta como el usuario logueado (su slug es exacto); si no hay sesión, cae al del tablero.
  const s = tidSession();
  const atleta = (s && s.slug) ? s.slug : ((DATA && DATA.atleta) ? DATA.atleta : "atleta");
  toast(`Preparando conexión con ${nm}…`);
  try{
    const r = await fetch("/api/connect", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({ secret, atleta, provider: prov }),
    });
    const j = await r.json();
    if(!r.ok || !j.widget_url){ toast(j.error || `No se pudo conectar ${nm}.`); return; }
    // Abre el widget de Junction (el atleta elige y hace login en su marca).
    window.open(j.widget_url, "_blank") || (location.href = j.widget_url);
  }catch(e){ toast("Error de red al conectar."); }
}

function guardarEvento(id){
  const g=k=>{ const el=document.getElementById(k); return el?el.value.trim():""; };
  const nombre=g("f_nombre"), dep=g("f_deporte");
  if(!nombre){ toast("Falta el nombre"); return; }

  const obj={nombre, tipo_deporte:dep, prioridad:prioSel, fecha_inicio:g("f_inicio"),
    fecha_fin:g("f_fin"), fecha_viaje:g("f_viaje"), sede:g("f_lugar"), meta:g("f_meta")};
  const evs=loadEventos();
  if(id==null) evs.push(obj); else evs[id]=obj;

  toast(id==null?"Evento guardado 🏆":"Evento actualizado");
  sincronizarEvento(obj);

async function sincronizarEvento(obj){
  const secret = localStorage.getItem("tid_secret") || "";
  if(!secret) return;  // sin clave: se queda solo en el teléfono
  try{
    const r = await fetch("/api/evento", {
      method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({secret, evento: evToJSON(obj)}),
    });
    if(r.ok) toast("Evento sincronizado al motor ✓");
    else { const e = await r.json().catch(()=>({})); toast("No sincronizó: "+(e.error||("HTTP "+r.status))); }
  }catch(e){ /* sin conexión: queda guardado local, se puede reintentar */ }
}
function guardarSecret(){
  const el=document.getElementById("f_secret"); if(!el) return;
  localStorage.setItem("tid_secret", el.value.trim());
  toast(el.value.trim()?"Clave guardada ✓":"Clave borrada");

function copiarJSON(i){
  const e=loadEventos()[i]; const txt=JSON.stringify(evToJSON(e),null,2);

}

/* ===== PUENTE NATIVO (Capacitor) — un solo lugar para ajustar los plugins =====
   En la app NATIVA (Fase B) usa: FC por Bluetooth (@capacitor-community/bluetooth-le)
   y GPS en segundo plano (@capacitor-community/background-geolocation).
   En el NAVEGADOR cae a Web Bluetooth + watchPosition (la PWA no cambia). */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const CAP = (window.Capacitor && window.Capacitor.Plugins) || {};
function parseHr(v){ const flags=v.getUint8(0); return (flags&1)? v.getUint16(1,true) : v.getUint8(1); }
// El plugin nativo entrega los bytes de la característica en base64 → DataView.
function b64ToDataView(b64){ try{ const s=atob(b64||""); const u=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return new DataView(u.buffer); }catch(e){ return null; } }

const RunGeo = {
  _id:null, _native:false,
  start(onPos, onErr){
    if(NATIVE && CAP.BackgroundGeolocation){
      this._native=true;
      CAP.BackgroundGeolocation.addWatcher(
        { backgroundMessage:"Grabando tu carrera…", backgroundTitle:"TID-MAX", requestPermissions:true, stale:false, distanceFilter:5 },
        (loc, err)=>{ if(err){ onErr({code: err.code==="NOT_AUTHORIZED"?1:2}); return; }
                      if(loc) onPos({coords:{latitude:loc.latitude, longitude:loc.longitude, accuracy:loc.accuracy}}); }
      ).then(id=>{ this._id=id; }).catch(()=>{ this._native=false;
        this._id=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:1000,timeout:20000}); });
      return;
    }
    this._native=false;
    this._id=navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
  },
  stop(){
    if(this._id==null) return;
    if(this._native && CAP.BackgroundGeolocation){ try{ CAP.BackgroundGeolocation.removeWatcher({id:this._id}); }catch(e){} }
    else { try{ navigator.geolocation.clearWatch(this._id); }catch(e){} }
    this._id=null;
  }
};

const RunHR = {
  _dev:null, _char:null,
  connected(){ return !!this._char || !!this._dev; },
  async connect(onHr){
    if(NATIVE && CAP.BluetoothLe){ return this._nativeConnect(onHr); }
    if(!navigator.bluetooth) throw new Error("no-bt");
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:["heart_rate"]}]});
    this._dev=dev;
    dev.addEventListener("gattserverdisconnected", ()=>{ this._char=null; onHr(null,true); });
    const srv=await dev.gatt.connect();
    const ch=await (await srv.getPrimaryService("heart_rate")).getCharacteristic("heart_rate_measurement");
    await ch.startNotifications();
    ch.addEventListener("characteristicvaluechanged", ev=>onHr(parseHr(ev.target.value)));
    this._char=ch;
  },
  // NATIVO (Capacitor + @capacitor-community/bluetooth-le) — lee el Polar por BLE.
  async _nativeConnect(onHr){
    const BLE=CAP.BluetoothLe;
    const SVC="0000180d-0000-1000-8000-00805f9b34fb";   // Heart Rate Service
    const CH ="00002a37-0000-1000-8000-00805f9b34fb";   // Heart Rate Measurement
    await BLE.initialize({ androidNeverForLocation:true });
    const dev=await BLE.requestDevice({ services:[SVC] });
    const deviceId=dev.deviceId;
    this._native=true; this._deviceId=deviceId; this._svc=SVC; this._ch=CH;
    await BLE.connect({ deviceId });
    try{ await BLE.addListener("disconnected|"+deviceId, ()=>{ this._deviceId=null; onHr(null,true); }); }catch(e){}
    // Notificaciones de FC: el plugin emite un evento con los bytes en base64.
    const key=("notification|"+deviceId+"|"+SVC+"|"+CH).toLowerCase();
    await BLE.addListener(key, ev=>{ const dv=b64ToDataView(ev&&ev.value); if(dv) onHr(parseHr(dv)); });
    await BLE.startNotifications({ deviceId, service:SVC, characteristic:CH });
  },
  async disconnect(){
    if(this._native && CAP.BluetoothLe && this._deviceId){
      try{ await CAP.BluetoothLe.stopNotifications({deviceId:this._deviceId, service:this._svc, characteristic:this._ch}); }catch(e){}
      try{ await CAP.BluetoothLe.disconnect({deviceId:this._deviceId}); }catch(e){}
      this._native=false; this._deviceId=null; return;
    }
    try{ if(this._char) await this._char.stopNotifications(); }catch(e){}
    try{ if(this._dev&&this._dev.gatt&&this._dev.gatt.connected) this._dev.gatt.disconnect(); }catch(e){}
    this._char=null; this._dev=null;
  }
};
function fmtTime(ms){ const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
  return (h>0?h+":"+String(m).padStart(2,"0"):m)+":"+String(ss).padStart(2,"0"); }
function fmtPace(mpk){ if(!mpk||!isFinite(mpk)) return "—"; const m=Math.floor(mpk), s=Math.round((mpk-m)*60);
  return (s===60?(m+1)+"'00":m+"'"+String(s).padStart(2,"0"))+'"'; }
function hav(a,b){ const R=6371000, toR=x=>x*Math.PI/180, dLa=toR(b.lat-a.lat), dLo=toR(b.lon-a.lon);
  const q=Math.sin(dLa/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.min(1,Math.sqrt(q))); }
function runStatusText(){ return runState==="running"?"Grabando… GPS activo":runState==="paused"?"En pausa":runState==="done"?"Terminada":"Listo para iniciar"; }

/* --- Zonas de FC --- */
// FC máx del atleta: la guardada localmente (tid_fcmax) o, si el reporte trae edad, 220-edad.
function fcMax(){
  const g=parseInt(localStorage.getItem("tid_fcmax")||"0",10); if(g>0) return g;
  const p=(typeof DATA!=="undefined"&&DATA&&DATA.perfil)||null;
  if(p&&p.fc_max_carrera) return p.fc_max_carrera;
  if(p&&p.fc_max_estimada) return p.fc_max_estimada;
  if(p&&p.edad) return 220-p.edad;
  return null;
}
function runSetFcMax(v){ const n=parseInt(v,10); if(n>=120&&n<=230){ localStorage.setItem("tid_fcmax",String(n)); toast("FC máx: "+n+" lpm"); } paint(); }
const ZONAS=[null,
  {n:"Z1 Recuperación", c:"var(--good)"},
  {n:"Z2 Base aeróbica", c:"var(--good)"},
  {n:"Z3 Tempo",         c:"var(--accent-ink)"},
  {n:"Z4 Umbral",        c:"var(--warn)"},
  {n:"Z5 VO₂máx",        c:"var(--crit)"}];
function hrZone(bpm){ const mx=fcMax(); if(!mx||!bpm) return null; const p=bpm/mx;
  if(p<0.60)return 1; if(p<0.70)return 2; if(p<0.80)return 3; if(p<0.90)return 4; return 5; }

/* --- Splits por km --- */
function splitStats(){
  const secs=runSplits.map(s=>s.sec).filter(x=>x>0);
  if(!secs.length) return {avg:null,fastIdx:-1,slowIdx:-1};
  let fastIdx=0,slowIdx=0;
  runSplits.forEach((s,i)=>{ if(s.sec>0&&(runSplits[fastIdx].sec<=0||s.sec<runSplits[fastIdx].sec))fastIdx=i;
                             if(s.sec>0&&s.sec>runSplits[slowIdx].sec)slowIdx=i; });
  const avgSec=secs.reduce((a,b)=>a+b,0)/secs.length;
  return {avg:avgSec/60, fastIdx, slowIdx};
}
function splitHrStats(fromMs,toMs){
  const xs=runHrSamples.filter(s=>s.rel>=fromMs&&s.rel<toMs).map(s=>s.bpm);
  if(!xs.length) return {avg:null,max:null};
  return {avg:Math.round(xs.reduce((a,b)=>a+b,0)/xs.length), max:Math.max.apply(null,xs)};
}

/* --- Progreso de desbloqueo de zonas (cuenta entrenos con FC) --- */
function zoneUnlock(){
  let runs=[]; try{ runs=JSON.parse(localStorage.getItem("tid_runs")||"[]"); }catch(e){}
  const conFC=runs.filter(r=>r&&r.hr_avg);
  const calidad=conFC.filter(r=>r.hr_max&&fcMax()&&(r.hr_max/fcMax())>=0.80).length;
  const n=conFC.length;
  return {
    n, calidad,
    ajustadas: n>=5,
    estimadas: n>=10 && calidad>=2,
    metaAjust:5, metaEstim:10,
    fcMaxObs: Math.max(0, ...conFC.map(r=>r.hr_max||0)) || null,
  };
}

      <div style="font-size:16px">${u.estimadas?"🔓":"🔒"}</div>
      <div style="flex:1"><div style="font-size:12px;font-weight:700">Estimadas (VT1/VT2)</div>${bar(Math.min(u.n,u.metaEstim),u.metaEstim)}</div>
      <div style="font-size:11px;color:var(--dim);width:34px;text-align:right">${Math.min(u.n,u.metaEstim)}/${u.metaEstim}</div>
    </div>
    <div style="font-size:11px;color:var(--faint);margin-top:8px">${u.n} entreno(s) con FC · ${u.calidad} de calidad${u.n<u.metaEstim?` · faltan ${u.metaEstim-u.n} (incluye ${Math.max(0,2-u.calidad)} de calidad)`:""}.</div>
  </div>`;
  return `
  <div class="card" style="padding:0;overflow:hidden">
    <div id="run_map" style="height:220px;width:100%;background:var(--map);position:relative">
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px">Cargando mapa…</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px">
      <div style="font-size:12px;color:var(--good);font-weight:700">● Inicio</div>
      <div style="font-size:13px;font-weight:800">${km.toFixed(2)} km</div>
      <div style="font-size:12px;color:var(--crit);font-weight:700">Fin ●</div>
    </div>
  </div>
  ${kpi3}
  ${hrCard}
  ${stat3}
  ${splitsList}
  ${unlockCard}
  <div class="sub-note" style="text-align:center">Sesión guardada en el teléfono. En la app nativa se subirá a tu tablero.</div>
  <button class="btn pri" onclick="openCorrer()" style="margin-top:10px">Nueva carrera</button>
  <button class="btn sec" onclick="switchTab('entrenar')">Volver</button>`;
}
function bindCorrer(){ if(runState==="done") setTimeout(renderRunMap, 40); }

function runStart(){
  if(!NATIVE && !navigator.geolocation){ toast("Este teléfono/navegador no da GPS."); return; }
  runReset(); runState="running"; runStartMs=Date.now(); runElapsedMs=0;
  RunGeo.start(runOnPos, runOnErr);
  runTimer=setInterval(runTick, 1000); runReqWake(); paint();
}
function runPause(){ if(runState!=="running")return; runElapsedMs+=Date.now()-runStartMs; runState="paused"; if(runTimer){clearInterval(runTimer);runTimer=null;} runLastPt=null; paint(); }
function runResume(){ if(runState!=="paused")return; runState="running"; runStartMs=Date.now(); runTimer=setInterval(runTick,1000); paint(); }
function runStop(){ if(runState==="running") runElapsedMs+=Date.now()-runStartMs; runStopWatch(); runState="done"; runSave(); paint(); }
function runStopWatch(){ RunGeo.stop(); if(runTimer){clearInterval(runTimer);runTimer=null;} runRelWake(); }
function runTick(){ const el=document.getElementById("run_time"); if(el) el.textContent=fmtTime(runElapsedMs+(runState==="running"?Date.now()-runStartMs:0)); }
function runOnPos(pos){
  if(runState!=="running")return;
  const c=pos.coords; if(c.accuracy && c.accuracy>40){ return; }
  const pt={lat:c.latitude, lon:c.longitude, t:Date.now()};
  if(runLastPt){ const d=hav(runLastPt,pt); if(d>=2 && d<80){ runDistM+=d; pt.d=runDistM; runPoints.push(pt); } }
  else { pt.d=runDistM; runPoints.push(pt); }
  runLastPt=pt;
  const totMs=runElapsedMs+(Date.now()-runStartMs);
  // Splits por km: registra cada km completado (marca de tiempo del punto que cruza el límite).
  let nuevoSplit=false;
  while(runSplits.length < Math.floor(runDistM/1000)){
    const prevMs=runSplits.length? runSplits[runSplits.length-1]._cumMs : 0;
    const hr=splitHrStats(prevMs,totMs);
    runSplits.push({km:runSplits.length+1, sec:Math.round((totMs-prevMs)/1000), hrAvg:hr.avg, hrMax:hr.max, _cumMs:totMs});
    nuevoSplit=true;
  }
  const dk=document.getElementById("run_dist"); if(dk) dk.textContent=(runDistM/1000).toFixed(2);
  const pace=runDistM>20?(totMs/60000)/(runDistM/1000):null;
  const pk=document.getElementById("run_pace"); if(pk) pk.textContent=fmtPace(pace);
  const st=document.getElementById("run_status"); if(st) st.textContent="Grabando… GPS activo";
  if(nuevoSplit){ paint(); } else { updateSplitUI(totMs); }
}
function updateSplitUI(totMs){
  const doneKm=runSplits.length;
  const curDist=runDistM-doneKm*1000, curMs=totMs-(doneKm?runSplits[doneKm-1]._cumMs:0);
  const curPace=curDist>30?(curMs/60000)/(curDist/1000):null;
  const ce=document.getElementById("run_curkm"); if(ce) ce.textContent=fmtPace(curPace);
  const pe=document.getElementById("run_prevkm"); if(pe) pe.textContent=fmtPace(doneKm?runSplits[doneKm-1].sec/60:null);
}
function runOnErr(e){ const s=document.getElementById("run_status"); if(s) s.textContent=(e&&e.code===1)?"GPS: permiso denegado":"GPS: buscando señal…"; }
function runReqWake(){ try{ if("wakeLock" in navigator) navigator.wakeLock.request("screen").then(w=>{runWakeLock=w;}).catch(()=>{}); }catch(e){} }
function runRelWake(){ try{ if(runWakeLock){ runWakeLock.release(); runWakeLock=null; } }catch(e){} }
function runQuit(){ if((runState==="running"||runState==="paused") && !confirm("¿Salir y descartar la carrera en curso?")) return; runStopWatch(); runReset(); switchTab("entrenar"); }
function runSave(){
  const km=runDistM/1000, durS=Math.round(runElapsedMs/1000), pace=km>0.02?(runElapsedMs/60000)/km:null;
  const hrAll=runHrSamples.map(s=>s.bpm);
  const hrAvg=hrAll.length?Math.round(hrAll.reduce((a,b)=>a+b,0)/hrAll.length):null;
  const hrMax=hrAll.length?Math.max.apply(null,hrAll):null;
  const rec={ fecha:new Date().toISOString(), deporte:"running", dist_km:+km.toFixed(3), dur_s:durS,
    pace_min_km: pace?+pace.toFixed(2):null, n_puntos:runPoints.length,
    hr_avg:hrAvg, hr_max:hrMax,
    splits: runSplits.map(s=>({km:s.km, sec:s.sec, hr_avg:s.hrAvg, hr_max:s.hrMax})),
    ruta: runPoints.map(p=>[+p.lat.toFixed(5),+p.lon.toFixed(5)]) };
  try{ const arr=JSON.parse(localStorage.getItem("tid_runs")||"[]"); arr.unshift(rec); localStorage.setItem("tid_runs", JSON.stringify(arr.slice(0,50))); }catch(e){}
  toast(`Carrera guardada · ${km.toFixed(2)} km`);
  runUpload(rec);
}
// Sube la corrida a tu cuenta (repo como BD) si hay sesión. Best-effort: si falla,
// queda guardada en el teléfono y se puede reintentar; nunca bloquea el guardado.
async function runUpload(rec){
  const tok=tidToken(); if(!tok) return;
  try{
    const r=await fetch("/api/run",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({token:tok, run:rec})});
    if(r.ok){ const j=await r.json().catch(()=>({})); if(j.ok&&!j.dup) toast("Corrida subida a tu cuenta ✓"); }
  }catch(e){ /* sin conexión: se queda en el teléfono */ }
}

/* ---------------- FC en vivo por Bluetooth (Polar H10 / reloj con broadcast) ---------------- */
function updateHrUI(){
  const he=document.getElementById("run_hr"); if(he) he.textContent=runHr||"—";
  const ze=document.getElementById("run_zone"); if(ze){ const z=runHr?hrZone(runHr):null, zc=z?ZONAS[z]:null;
    ze.innerHTML = zc? `<span style="display:inline-block;font-size:12px;font-weight:800;color:#fff;background:${zc.c};padding:3px 9px;border-radius:999px">${zc.n}</span>`
      : `<span style="font-size:12px;color:var(--faint)">${fcMax()?"Sin señal de pulso":"Falta tu FC máx"}</span>`; }
}
function onHrSample(hr, dropped){
  if(dropped){ runHr=null; runBtChar=false; if(screen==="correr"&&runState!=="done") paint(); return; }
  if(!hr) return; runHr=hr;
  if(runState==="running") runHrSamples.push({rel:runElapsedMs+(Date.now()-runStartMs), bpm:hr});
  updateHrUI();
}
async function runConnectHr(){
  try{
    await RunHR.connect(onHrSample);
    runBtChar=true; toast("Polar conectado ✓"); paint();
  }catch(e){
    const m=String((e&&e.message)||e);
    if(m==="no-bt") toast("Tu navegador no lee Bluetooth. En iPhone usa la app Bluefy; en Android, Chrome.");
    else if(m==="native-hr-pending") toast("La FC nativa se activa en la app compilada (Fase B).");
    else toast("No se pudo conectar. Acerca el Polar y verifica que esté encendido.");
  }
}
async function runDisconnectHr(){ await RunHR.disconnect(); runBtChar=false; runHr=null; paint(); }

/* ---------------- Mapa de la ruta (Leaflet + OpenStreetMap, respaldo SVG) ---------------- */
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||"#888"; }
function kmColorFor(kmIdx){
  const st=splitStats();
  if(!runSplits.length) return getCss("--accent");
  if(st.fastIdx>=0 && runSplits[st.fastIdx] && kmIdx===runSplits[st.fastIdx].km) return getCss("--good");
  if(st.slowIdx>=0 && runSplits[st.slowIdx] && kmIdx===runSplits[st.slowIdx].km) return getCss("--warn");
  return getCss("--accent");
}
let _leafletP=null;
function loadLeaflet(){
  if(window.L) return Promise.resolve();
  if(_leafletP) return _leafletP;
  _leafletP=new Promise((res,rej)=>{
    const css=document.createElement("link"); css.rel="stylesheet"; css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const s=document.createElement("script"); s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.onload=()=>res(); s.onerror=()=>rej(new Error("leaflet")); document.head.appendChild(s);
    setTimeout(()=>{ window.L?res():rej(new Error("timeout")); }, 6000);
  });
  return _leafletP;
}
function renderRunMap(){
  const box=document.getElementById("run_map"); if(!box) return;
  const pts=runPoints.filter(p=>p&&isFinite(p.lat)&&isFinite(p.lon));
  if(pts.length<2){ box.innerHTML='<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:13px">Sin ruta GPS suficiente</div>'; return; }
  loadLeaflet().then(()=>drawLeaflet(box,pts)).catch(()=>drawSvgRoute(box,pts));
}
function drawLeaflet(box,pts){
  box.innerHTML="";
  const map=L.map(box,{zoomControl:false,attributionControl:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
  const ll=pts.map(p=>[p.lat,p.lon]);
  for(let i=1;i<pts.length;i++){
    const kmIdx=Math.floor((pts[i].d||0)/1000)+1;
    L.polyline([ll[i-1],ll[i]],{color:kmColorFor(kmIdx),weight:5,opacity:.9,lineJoin:"round"}).addTo(map);
  }
  L.circleMarker(ll[0],{radius:7,color:"#fff",weight:2,fillColor:getCss("--good"),fillOpacity:1}).addTo(map);
  L.circleMarker(ll[ll.length-1],{radius:7,color:"#fff",weight:2,fillColor:getCss("--crit"),fillOpacity:1}).addTo(map);
  try{ map.fitBounds(L.latLngBounds(ll).pad(0.15)); }catch(e){}
  setTimeout(()=>map.invalidateSize(),60);
}
function drawSvgRoute(box,pts){
  const W=box.clientWidth||320, H=box.clientHeight||220, pad=16;
  let minLa=1e9,maxLa=-1e9,minLo=1e9,maxLo=-1e9;
  pts.forEach(p=>{ minLa=Math.min(minLa,p.lat);maxLa=Math.max(maxLa,p.lat);minLo=Math.min(minLo,p.lon);maxLo=Math.max(maxLo,p.lon); });
  const sLa=(maxLa-minLa)||1e-6, sLo=(maxLo-minLo)||1e-6, sc=Math.min((W-2*pad)/sLo,(H-2*pad)/sLa);
  const X=lo=>pad+(lo-minLo)*sc+((W-2*pad)-sLo*sc)/2, Y=la=>H-pad-(la-minLa)*sc-((H-2*pad)-sLa*sc)/2;
  let segs="";
  for(let i=1;i<pts.length;i++){ const kmIdx=Math.floor((pts[i].d||0)/1000)+1;
    segs+=`<line x1="${X(pts[i-1].lon).toFixed(1)}" y1="${Y(pts[i-1].lat).toFixed(1)}" x2="${X(pts[i].lon).toFixed(1)}" y2="${Y(pts[i].lat).toFixed(1)}" stroke="${kmColorFor(kmIdx)}" stroke-width="4" stroke-linecap="round"/>`; }
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%">${segs}
    <circle cx="${X(pts[0].lon).toFixed(1)}" cy="${Y(pts[0].lat).toFixed(1)}" r="6" fill="${getCss("--good")}" stroke="#fff" stroke-width="2"/>
    <circle cx="${X(pts[pts.length-1].lon).toFixed(1)}" cy="${Y(pts[pts.length-1].lat).toFixed(1)}" r="6" fill="${getCss("--crit")}" stroke="#fff" stroke-width="2"/>
  </svg><div style="position:absolute;bottom:6px;left:8px;font-size:10px;color:var(--faint)">Mapa sin conexión — trazo aproximado</div>`;
}

/* ---------------- Sesión / login privado por persona ---------------- */
const TID_TOKEN_KEY = "tid_token";
function tidToken(){ return (localStorage.getItem(TID_TOKEN_KEY)||"").trim(); }
function tidSession(){ try{ return JSON.parse(localStorage.getItem("tid_session")||"null"); }catch(e){ return null; } }

// Carga los datos. CUENTAS INDEPENDIENTES: si hay sesión, muestra SOLO el reporte
// propio (/api/me) y NUNCA cae al tablero público de otro atleta. El tablero público
// (data.json) es únicamente para quien NO ha iniciado sesión.
async function bootData(){
  const view=document.getElementById("view");
  const tok = tidToken();
  if(tok){
    try{
      const r = await fetch("/api/me", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({token:tok})});
      if(r.ok){ const j=await r.json(); DATA=j.data; paint(); return; }
      if(r.status===401){
        // Sesión inválida/expirada: cerrar sesión y (ya sin token) mostrar el público.
        localStorage.removeItem(TID_TOKEN_KEY); localStorage.removeItem("tid_session");
        toast("Tu sesión expiró, entra de nuevo.");
      } else {
        // Logueado pero sin reporte propio (404) u otro error: estado vacío PROPIO,
        // jamás el tablero de otro atleta. paint() lo renderiza y deja navegar tabs.
        const j = await r.json().catch(()=>({}));
        sinDatosMsg = (j&&j.error) || "Aún no hay datos de tu cuenta.";
        DATA = null; paint(); return;
      }
    }catch(e){
      sinDatosMsg = "Sin conexión. Reintenta en un momento.";
      DATA = null; paint(); return;
    }
  }
  // Sin sesión → tablero público (como hoy).
  try{ const r = await fetch("./data.json?v="+Date.now()); DATA = await r.json(); paint(); }
  catch(e){ view.innerHTML='<div class="loading">No pude cargar los datos.<br>'+esc(e.message)+'</div>'; }
}

async function tidLogin(user, pin){
  try{
    const r = await fetch("/api/login", {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({user, pin})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.token){ toast(j.error||"No pude iniciar sesión."); return false; }
    localStorage.setItem(TID_TOKEN_KEY, j.token);
    localStorage.setItem("tid_session", JSON.stringify({slug:j.slug, nombre:j.nombre}));
    toast("Bienvenido"+(j.nombre?(", "+String(j.nombre).split(" ")[0]):"")+" 👋");
    await bootData(); activeTab="hoy"; screen=null; paint(); return true;
  }catch(e){ toast("Error de red al entrar."); return false; }
}
function tidLoginFromUI(){
  const u=(document.getElementById("lg_user")||{}).value||"";
  const p=(document.getElementById("lg_pin")||{}).value||"";
  if(!u.trim()||!p.trim()){ toast("Escribe correo y PIN."); return; }
  tidLogin(u, p);
}
function setAuthMode(m){ authMode=m; if(activeTab==="perfil"&&!screen) paint(); }

// Alta de usuario real desde la app: crea la cuenta (api/registro) y deja logueado.
async function tidRegister(payload){
  try{
    const r = await fetch("/api/registro", {method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify(payload)});
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.token){ toast(j.error||"No pude crear la cuenta."); return false; }
    localStorage.setItem(TID_TOKEN_KEY, j.token);
    localStorage.setItem("tid_session", JSON.stringify({slug:j.slug, nombre:j.nombre}));
    toast("Cuenta creada 🎉 Bienvenido"+(j.nombre?(", "+String(j.nombre).split(" ")[0]):""));
    authMode="login"; await bootData(); activeTab="hoy"; screen=null; paint(); return true;
  }catch(e){ toast("Error de red al crear la cuenta."); return false; }
}
function tidRegisterFromUI(){
  const g=id=>(document.getElementById(id)||{}).value||"";
  const nombre=g("rg_nombre").trim(), email=g("rg_email").trim(), pin=g("rg_pin");
  const deporte=g("rg_deporte")||"otro", code=g("rg_code").trim(), nacimiento=g("rg_nac").trim();
  const peso=g("rg_peso").trim();
  const hp=g("rg_hp"), t=Date.now()-(parseInt(g("rg_t"),10)||Date.now());
  if(!nombre){ toast("Escribe tu nombre."); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast("Correo no válido."); return; }
  if((pin||"").length<4){ toast("El PIN debe tener al menos 4 caracteres."); return; }
  if(!nacimiento){ toast("Pon tu fecha de nacimiento."); return; }
  tidRegister({nombre, email, pin, deporte, code, hp, t, nacimiento, peso});
}
function tidLogout(){
  localStorage.removeItem(TID_TOKEN_KEY); localStorage.removeItem("tid_session");
  toast("Sesión cerrada"); bootData(); activeTab="hoy"; screen=null; paint();
}

bootData();

// Regreso del widget de Junction: si la URL trae ?connected=<marca>, avisa y abre Datos.
(function(){
  try{
    const p = new URLSearchParams(location.search);
    const c = p.get("connected");
    if(c){
      const marca = c==="ok" ? "tu cuenta" : c.charAt(0).toUpperCase()+c.slice(1);
      activeTab = "datos";
      setTimeout(()=>toast(`✅ ${marca} conectada`), 400);
      history.replaceState(null, "", location.pathname);  // limpia la URL
    }
  }catch(e){}
})();

if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(()=>{});}

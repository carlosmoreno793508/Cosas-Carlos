<svg width="720" height="200" viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo horizontal de MoreTV: ícono + wordmark, sobre fondo transparente. -->
  <defs>
    <linearGradient id="bg" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c6fff"/>
      <stop offset="1" stop-color="#6b8bff"/>
    </linearGradient>
    <linearGradient id="play" x1="70" y1="70" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe4ff"/>
    </linearGradient>
  </defs>

  <!-- Ícono (versión compacta) -->
  <g transform="translate(20,20)">
    <rect x="0" y="0" width="160" height="160" rx="38" fill="url(#bg)"/>
    <rect x="34" y="44" width="92" height="66" rx="12" fill="#0f1116"/>
    <rect x="66" y="110" width="28" height="6" rx="3" fill="#0f1116"/>
    <rect x="52" y="116" width="56" height="6" rx="3" fill="#0f1116"/>
    <path d="M70 62 L102 77 L70 92 Z" fill="url(#play)"/>
    <circle cx="122" cy="44" r="20" fill="#0f1116"/>
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
      <line x1="122" y1="35" x2="122" y2="53"/>
      <line x1="113" y1="44" x2="131" y2="44"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="210" y="128" font-family="DejaVu Sans, sans-serif" font-size="92" font-weight="bold">
    <tspan fill="#f4f6fb">More</tspan><tspan fill="#6b8bff">TV</tspan>
  </text>
</svg>
